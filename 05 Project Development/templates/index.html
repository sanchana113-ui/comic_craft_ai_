<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - AI Comic Story Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700;800&family=Kalam:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff3344;
            --primary-dark: #d6182a;
            --secondary: #ffb703;
            --dark: #12131a;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: #12131a;
            --shadow-comic: 6px 6px 0px #12131a;
            --shadow-comic-sm: 4px 4px 0px #12131a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 51, 68, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 183, 3, 0.15) 0%, transparent 40%),
                radial-gradient(#1e293b 2px, transparent 2px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: #1e293b;
            min-height: 100vh;
            padding: 30px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Comic Header Banner */
        .header-container {
            text-align: center;
            max-width: 800px;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background: var(--secondary);
            color: var(--dark);
            font-weight: 800;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid var(--dark);
            box-shadow: 3px 3px 0px var(--dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            transform: rotate(-2deg);
        }

        .title-brand {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 4px 4px 0px var(--primary), 8px 8px 0px var(--dark);
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.15rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        /* Main Form Card */
        .form-card {
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            border-radius: 18px;
            box-shadow: var(--shadow-comic);
            width: 100%;
            max-width: 760px;
            padding: 35px 40px;
            position: relative;
        }

        .card-header-tag {
            position: absolute;
            top: -18px;
            left: 30px;
            background: var(--primary);
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 1.3rem;
            letter-spacing: 1px;
            padding: 4px 18px;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-comic-sm);
        }

        /* Sample Prompt Quick Chips */
        .chips-container {
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 2px dashed #e2e8f0;
        }

        .chips-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .chips-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-btn {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #334155;
        }

        .chip-btn:hover {
            background: #fee2e2;
            border-color: var(--primary);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .label-hint {
            font-weight: normal;
            color: #64748b;
            font-size: 0.85rem;
        }

        textarea, input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: #0f172a;
            background: #ffffff;
            border: 2.5px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            box-shadow: 3px 3px 0px #cbd5e1;
            transition: all 0.2s;
        }

        textarea:focus, input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 4px 4px 0px var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 18px;
        }

        @media (max-width: 650px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
            .form-card {
                padding: 30px 20px;
            }
            .title-brand {
                font-size: 3rem;
            }
        }

        /* Submit Button */
        .btn-submit {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            letter-spacing: 2px;
            padding: 16px;
            border: 3px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-comic);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            margin-top: 28px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px var(--border-color);
        }

        .btn-submit:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        /* Loading Overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.92);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .loading-box {
            background: white;
            border: 4px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 8px 8px 0px var(--secondary);
            max-width: 500px;
            width: 90%;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f1f5f9;
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-title {
            font-family: 'Bangers', cursive;
            font-size: 2.2rem;
            color: var(--dark);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .loading-step {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header class="header-container">
        <div class="badge">AI Story & Art Studio</div>
        <h1 class="title-brand">ComicCraft</h1>
        <p class="subtitle">Turn your creative ideas into a full 5-panel comic book with Gemini & Stable Diffusion</p>
    </header>

    <main class="form-card">
        <div class="card-header-tag">COMIC GENERATOR</div>

        <!-- Pre-set sample scenarios for quick exploration -->
        <div class="chips-container">
            <div class="chips-label">Try an Example Scenario:</div>
            <div class="chips-row">
                <button type="button" class="chip-btn" onclick="applySample('A brave fox exploring an enchanted forest filled with ancient glowing runes and hidden whispers', 'Finn', 'Enchanted Forest', 'Dramatic', 'Anime')">
                    🦊 Scenario 1: Brave Fox in Forest
                </button>
                <button type="button" class="chip-btn" onclick="applySample('A clumsy robot trying to bake a five-tier wedding cake in a busy restaurant kitchen with hilarious mishaps', 'Robo-Chip', 'City Kitchen', 'Funny', 'Comic Book')">
                    🤖 Scenario 2: Clumsy Baker Robot
                </button>
                <button type="button" class="chip-btn" onclick="applySample('An adventurous cosmic explorer finding an ancient planetary beacon floating near Saturns rings', 'Captain Nova', 'Deep Space', 'Poetic', 'Realistic')">
                    🚀 Scenario 3: Cosmic Explorer
                </button>
            </div>
        </div>

        <form id="comicForm" action="/generate" method="POST" onsubmit="showLoading()">
            
            <div class="form-group">
                <label for="story_prompt">
                    Story Prompt <span class="label-hint">(Describe the plot, mission, or adventure)</span>
                </label>
                <textarea id="story_prompt" name="story_prompt" required placeholder="e.g. A brave fox exploring an enchanted forest, searching for a legendary glowing flower...">A brave fox exploring an enchanted forest</textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="character_name">Main Character Name</label>
                    <input type="text" id="character_name" name="character_name" value="Finn" required placeholder="e.g. Finn, Leo, Maya">
                </div>

                <div class="form-group">
                    <label for="setting">Setting / Location</label>
                    <select id="setting" name="setting">
                        <option value="Enchanted Forest" selected>Enchanted Forest</option>
                        <option value="School Campus">School Campus</option>
                        <option value="Futuristic Cyberpunk City">Futuristic Cyberpunk City</option>
                        <option value="Deep Outer Space">Deep Outer Space</option>
                        <option value="Ancient Desert Ruins">Ancient Desert Ruins</option>
                        <option value="Underwater Kingdom">Underwater Kingdom</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="tone">Story Tone</label>
                    <select id="tone" name="tone">
                        <option value="Dramatic" selected>Dramatic (Thrilling & intense)</option>
                        <option value="Funny">Funny (Lighthearted & comedic)</option>
                        <option value="Poetic">Poetic (Mystical & thoughtful)</option>
                        <option value="Action-Packed">Action-Packed (High energy)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="art_style">Art Style</label>
                    <select id="art_style" name="art_style">
                        <option value="Anime" selected>Anime Style</option>
                        <option value="Comic Book">Classic Comic Book Style</option>
                        <option value="Pixel Art">Retro Pixel Art Style</option>
                        <option value="Realistic">Cinematic Realistic</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                ⚡ CRAFT MY 5-PANEL COMIC!
            </button>
        </form>
    </main>

    <!-- Animated Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <h2 class="loading-title">CRAFTING COMIC...</h2>
            <p id="loadingStatus" class="loading-step">
                Consulting Gemini Flash for panel outlines...<br>
                Please wait while illustrations and dialogues are created.
            </p>
        </div>
    </div>

    <script>
        function applySample(prompt, character, setting, tone, style) {
            document.getElementById('story_prompt').value = prompt;
            document.getElementById('character_name').value = character;
            document.getElementById('setting').value = setting;
            document.getElementById('tone').value = tone;
            document.getElementById('art_style').value = style;
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            const statusEl = document.getElementById('loadingStatus');
            const messages = [
                "1/4: Gemini Flash is designing a 5-panel story outline...",
                "2/4: Gemini Pro is scripting narration and dialogue...",
                "3/4: Stable Diffusion is illustrating each comic panel...",
                "4/4: Layout builder is formatting pages and compiling PDF..."
            ];
            let i = 0;
            setInterval(() => {
                i = (i + 1) % messages.length;
                statusEl.innerHTML = messages[i];
            }, 3000);
        }
    </script>
</body>
</html>
